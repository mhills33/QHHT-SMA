name: Update Calendly availability

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update availability
        env:
          CALENDLY_TOKEN: ${{ secrets.CALENDLY_TOKEN }}
        run: node scripts/update-availability.js

      - name: Save updated availability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability.json

          if git diff --cached --quiet; then
            echo "No availability changes."
          else
            git commit -m "Update Calendly availability"
            git push
          fi
